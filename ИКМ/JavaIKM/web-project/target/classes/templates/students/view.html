<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Студент</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Информация о студенте</h1>

<p><strong>ID:</strong> <span th:text="${student.id}">1</span></p>
<p>
  <strong>ФИО:</strong>
  <span th:text="${student.lastName}">Фамилия</span>
  <span th:text="${student.firstName}">Имя</span>
  <span th:text="${student.middleName}">Отчество</span>
</p>
<p>
  <strong>Дата рождения:</strong>
  <span th:text="${student.birthDay}">01</span>.
  <span th:text="${student.birthMonth}">01</span>.
  <span th:text="${student.birthYear}">2000</span>
</p>
<p>
  <strong>Группа:</strong>
  <span th:text="${group.name}">Группа</span>
</p>

<div>
  <a th:href="@{|/faculties/${facultyId}/groups/${group.id}/students|}">Назад к студентам</a> |
  <a th:href="@{|/faculties/${facultyId}/groups/${group.id}/students/${student.id}/edit|}">Изменить</a>
</div>
</body>
</html>
